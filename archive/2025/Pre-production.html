
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Deepavali Greetings with Flowerpots</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      background: url('pexels-photo-18401306.jpeg') no-repeat center center fixed;
	  background-size: 100% auto;

    }

    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 0;
    }

    .lamps-wrapper {
      display: flex;
      gap: 250px;
      z-index: 3;
    }

    .lamp-container {
      position: relative;
      width: 200px;
      height: 200px;
      cursor: pointer;
    }

    .lamp-img {
      width: 100%;
      filter: brightness(0.5);
      transition: filter 0.3s ease;
    }

    .flame {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 110px;
      background: radial-gradient(circle at 50% 20%, #fff6a9, #ffb300 50%, transparent 70%);
      clip-path: polygon(50% 0%, 70% 25%, 80% 50%, 70% 75%, 50% 100%, 30% 75%, 20% 50%, 30% 25%);
      opacity: 0;
      filter: drop-shadow(0 0 15px #ffb300);
      transition: opacity 0.3s ease;
    }

    .flame::after {
      content: '';
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      height: 50px;
      background: radial-gradient(circle at 50% 30%, #fff7d4, #ffd966 60%, transparent 80%);
      clip-path: polygon(50% 0%, 70% 25%, 80% 50%, 70% 75%, 50% 100%, 30% 75%, 20% 50%, 30% 25%);
      opacity: 0.8;
    }

    @keyframes flicker {
      0%   { transform: translateX(-50%) scale(1) rotate(-1deg); opacity: 0.85; filter: drop-shadow(0 0 10px #ffb300); }
      25%  { transform: translateX(-50%) scale(1.05) rotate(1deg); opacity: 1; filter: drop-shadow(0 0 25px #ffd966); }
      50%  { transform: translateX(-50%) scale(0.95) rotate(-2deg); opacity: 0.9; }
      75%  { transform: translateX(-50%) scale(1.1) rotate(1deg); opacity: 1; }
      100% { transform: translateX(-50%) scale(1) rotate(0deg); opacity: 0.85; }
    }

    .lamp-container.lit .flame {
      opacity: 0.9;
      animation: flicker 0.2s infinite alternate;
    }

    .lamp-container.lit .lamp-img {
      filter: brightness(1.3) drop-shadow(0 0 25px #ffb300);
    }

    .container {
      text-align: center;
      padding: 20px 40px;
    }

    #greeting {
      font-size: 2.2em;
      font-weight: bold;
      opacity: 0;
      transform: scale(0.98);
      transition: opacity 0.8s ease, transform 0.8s ease;
      color: #ffcc66;
    }

    #langMessage {
      font-size: 1.1em;
      opacity: 0;
      transition: opacity 0.8s ease;
      margin-top: 8px;
      color: #ffcc66;
    }

    .show #greeting, 
    .show #langMessage {
      opacity: 1;
      transform: scale(1);
    }

    #messageBox {
      position: relative;
      z-index: 4;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .flowerpot {
      position: fixed;
      bottom: 20px;
      width: 80px;
      height: 80px;
      background: radial-gradient(ellipse at center, #663300 0%, #331a00 80%);
      border-radius: 0 0 50% 50%;
      z-index: 4;
    }

    #flowerpotLeft {
      left: 30px;
    }

    #flowerpotRight {
      right: 30px;
    }

    @media (max-width: 768px) {
      .lamps-wrapper {
        flex-direction: column;
        gap: 40px;
      }
      #greeting {
        font-size: 1.5em;
      }
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <canvas id="sky"></canvas>

  <div class="lamps-wrapper">
    <div class="lamp-container" id="deepaLamp1">
      <img src="deepa.png" alt="Deepa Lamp 1" class="lamp-img" />
      <div class="flame"></div>
    </div>
    <div class="lamp-container" id="deepaLamp2">
      <img src="deepa.png" alt="Deepa Lamp 2" class="lamp-img" />
      <div class="flame"></div>
    </div>
  </div>

  <div class="container" id="messageBox">
    <h1 id="greeting">🎆 ದೀಪಾವಳಿ ಹಬ್ಬದ ಶುಭಾಶಯಗಳು 🎆</h1>
    <h6 id="langMessage">Kannada</h6>
  </div>

  <div id="flowerpotLeft" class="flowerpot"></div>
  <div id="flowerpotRight" class="flowerpot"></div>

  <script>
    // ********** Setup canvas, fireworks, particles logic **********

    const canvas = document.getElementById("sky");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const greeting = document.getElementById("greeting");
    const langMessage = document.getElementById("langMessage");
    const messageBox = document.getElementById("messageBox");

    const texts = {
  Assamese: "দীপাৱলীৰ শুভেচ্ছা",
  Bengali: "শুভ দীপাবলি",
  Bodo: "हामब्लायथि दिवालि",
  Dogri: "देआली दियां शुभकामनां",
English:"Happy Deepawali",
  Gujarati: "હેપ્પી દિવાળી",
  Hindi: "शुभ दीपावली",
  Kannada: "ದೀಪಾವಳಿ ಹಬ್ಬದ ಶುಭಾಷಯಗಳು",
  Kashmiri: "دیوالی مبارک",
  Konkani: "दिवाळेचीं परबीं",
  Maithili: "शुभ दीपावली",
  Malayalam: "സന്തോഷകരമായ ദീപാവലി",
  Manipuri: "ꯗꯤꯄꯥꯕꯂꯤꯒꯤ ꯌꯥꯏꯐ-ꯄꯥꯎꯖꯦꯜ",
  Marathi: "दीपावलीच्या हार्दिक शुभेच्छा",
  Nepali: "शुभ दीपावली",
  Odia: "ଶୁଭ ଦୀପାବଳି",
  Punjabi: "ਸ਼ੁਭ ਦੀਪਾਵਲੀ",
  Sanskrit: "सुखदं दीपावल्याः",
  Santali: "ᱨᱟᱹᱥᱠᱟᱹ ᱫᱤᱯᱟᱣᱟᱞᱤ",
  Sindhi: "خوشيءَ ڀريو ديپاولی",
  Tamil: "இனிய தீபாவளி வாழ்த்துகள்",
  Telugu: "దీపావళి శుభాకాంక్షలు",
  Urdu: "ہیپی دیوالی"
    };

    const languages = Object.keys(texts);
    let index = 0;

    function updateGreeting() {
      const lang = languages[index];
      const message = texts[lang];
      messageBox.classList.remove("show");
      setTimeout(() => {
        greeting.textContent = `🎇 ${message} 🎇`;
        langMessage.textContent = lang;
        messageBox.classList.add("show");
      }, 400);
      index = (index + 1) % languages.length;
    }

    // Firework / Particle / Ring classes (same as your original) …
    class Particle {
      constructor(x, y, color, velocity, size, life) {
        this.x = x; this.y = y;
        this.color = color;
        this.velocity = velocity;
        this.size = size;
        this.life = life;
        this.alpha = 1;
      }
      update() {
        this.x += this.velocity.x;
        this.y += this.velocity.y;
        this.velocity.y += 0.02;
        this.velocity.x *= 0.995;
        this.life -= 1;
        this.alpha = Math.max(this.life / 120, 0);
      }
      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, Math.max(1, this.size * 6));
        grad.addColorStop(0, this._rgba(this.color, 0.95));
        grad.addColorStop(0.2, this._rgba(this.color, 0.8));
        grad.addColorStop(0.5, this._rgba(this.color, 0.35));
        grad.addColorStop(1, this._rgba(this.color, 0));
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * 2.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.fillStyle = this.color;
        ctx.globalAlpha = Math.min(1, this.alpha * 1.2);
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
      _rgba(hex, a) {
        let c = hex.replace('#','');
        if (c.length === 3) c = c.split('').map(ch => ch+ch).join('');
        const r = parseInt(c.substring(0,2),16),
              g = parseInt(c.substring(2,4),16),
              b = parseInt(c.substring(4,6),16);
        return `rgba(${r},${g},${b},${a})`;
      }
    }

    class Ring {
      constructor(x, y, color) {
        this.x = x; this.y = y;
        this.r = 10;
        this.maxR = 120 + Math.random() * 60;
        this.width = 6 + Math.random() * 4;
        this.alpha = 0.9;
        this.color = color;
      }
      update() {
        this.r += 6 + Math.random() * 4;
        this.alpha -= 0.02 + Math.random() * 0.01;
      }
      draw(ctx) {
        if (this.alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha = this.alpha * 0.9;
        ctx.strokeStyle = this.color;
        ctx.lineWidth = this.width;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }

    class Firework {
      constructor(startX, startY, targetX, targetY) {
        this.x = startX; this.y = startY;
        this.targetX = targetX; this.targetY = targetY;
        this.speed = 8 + Math.random() * 3;
        this.angle = Math.atan2(targetY - startY, targetX - startX);
        this.trail = [];
        this.reached = false;
        this.color = ["#ff6b6b","#feca57","#54a0ff","#5f27cd","#1dd1a1","#fff176"][Math.floor(Math.random()*6)];
      }
      update() {
        const vx = Math.cos(this.angle) * this.speed;
        const vy = Math.sin(this.angle) * this.speed;
        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > 12) this.trail.shift();
        this.x += vx; this.y += vy;
        const dist = Math.hypot(this.targetX - this.x, this.targetY - this.y);
        if (Math.random() < 0.6) {
          const tiny = new Particle(
            this.x, this.y,
            this.color,
            { x: (Math.random()-0.5)*1.5, y: (Math.random()-0.5)*1.5 },
            Math.random()*1.5 + 0.3,
            18
          );
          tiny.life = 20 + Math.random()*20;
          particles.push(tiny);
        }
        if (dist < 12) this.reached = true;
      }
      draw(ctx) {
        if (this.trail.length > 0) {
          ctx.save();
          ctx.lineWidth = 10;
          ctx.strokeStyle = this.color;
          ctx.globalAlpha = 0.08;
          ctx.beginPath();
          ctx.moveTo(this.trail[0].x, this.trail[0].y);
          for (const p of this.trail) ctx.lineTo(p.x, p.y);
          ctx.stroke();

          ctx.lineWidth = 4;
          ctx.globalAlpha = 0.18;
          ctx.beginPath();
          ctx.moveTo(this.trail[0].x, this.trail[0].y);
          for (const p of this.trail) ctx.lineTo(p.x, p.y);
          ctx.stroke();
          ctx.restore();
        }
        ctx.save();
        ctx.beginPath();
        ctx.fillStyle = "#fff";
        ctx.globalAlpha = 1;
        ctx.arc(this.x, this.y, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    let fireworks = [];
    let particles = [];
    let rings = [];
    let autoFireworkInterval = null;
    let firstBlastDone = false;

    //const launchSound = new Audio("launch.mp3");
    const explodeSound = new Audio("explosion.mp3");

    function createExplosion(x, y) {
      const colors = ["#ff6b6b", "#feca57", "#54a0ff", "#5f27cd", "#1dd1a1", "#fff176"];
      const mainColor = colors[Math.floor(Math.random() * colors.length)];
      const count = 70 + Math.random() * 40;
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count;
        const speed = Math.random() * 6 + 2;
        const vx = Math.cos(angle) * speed;
        const vy = Math.sin(angle) * speed;
        const velocity = {
          x: vx * (0.9 + Math.random() * 0.6),
          y: vy * (0.9 + Math.random() * 0.6) - Math.random() * 1.2
        };
        particles.push(new Particle(
          x, y,
          colors[Math.floor(Math.random() * colors.length)],
          velocity,
          Math.random() * 2.5 + 0.6,
          120 + Math.random() * 30
        ));
      }
     // rings.push(new Ring(x, y, mainColor));
      explodeSound.currentTime = 0;
      explodeSound.play().catch(() => {});
      if (!firstBlastDone) {
        firstBlastDone = true;
        setTimeout(() => {
          messageBox.classList.add("show");
          setInterval(updateGreeting, 2800);
        }, 500);
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.globalCompositeOperation = 'source-over';
      // optional background image draw can be here
      ctx.globalCompositeOperation = 'lighter';

      for (let i = fireworks.length - 1; i >= 0; i--) {
        const f = fireworks[i];
        f.update();
        f.draw(ctx);
        if (f.reached) {
          createExplosion(f.x, f.y);
          fireworks.splice(i, 1);
        }
      }
      for (let i = rings.length - 1; i >= 0; i--) {
        const r = rings[i];
        r.update();
        r.draw(ctx);
        if (r.alpha <= 0) rings.splice(i, 1);
      }
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw(ctx);
        if (p.life <= 0 || p.alpha <= 0.01) particles.splice(i, 1);
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    function startAutoFireworks() {
      if (autoFireworkInterval) return;
      autoFireworkInterval = setInterval(() => {
        const startX = Math.random() * canvas.width;
        const startY = canvas.height;
        const targetX = Math.random() * canvas.width;
        const targetY = Math.random() * (canvas.height / 2);
        fireworks.push(new Firework(startX, startY, targetX, targetY));
        launchSound.currentTime = 0;
        launchSound.play().catch(() => {});
      }, 1200);
    }

    window.addEventListener("resize", () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    const lamps = [
      document.getElementById('deepaLamp1'),
      document.getElementById('deepaLamp2')
    ];
    let areLampsLit = false;
    let lampsClicked = false;

    lamps.forEach(lamp => {
      lamp.addEventListener('click', () => {
        lampsClicked = true;
        areLampsLit = !areLampsLit;
        lamps.forEach(l => l.classList.toggle('lit', areLampsLit));
        if (areLampsLit) {
          firstBlastDone = false;
          messageBox.classList.remove("show");
          startAutoFireworks();
          launchSound.play().catch(() => {});
        } else {
          messageBox.classList.remove("show");
          firstBlastDone = false;
          clearInterval(autoFireworkInterval);
          autoFireworkInterval = null;
        }
      });
    });

    function startFlowerpotCracker(x, y, duration = 3000) {
  const sparks = [];
  const smokes = [];
  let startTime = performance.now();
  const glowRadius = 200;

  function random(min, max) {
    return Math.random() * (max - min) + min;
  }

  function addSpark() {
    const angle = random(-Math.PI / 2 - 0.4, -Math.PI / 2 + 0.4);
    const speed = random(300, 900);
    const color =
      Math.random() < 0.6
        ? `hsl(${random(35, 50)},100%,${random(60, 80)}%)`
        : `hsl(${random(45, 60)},100%,${random(80, 95)}%)`;
    sparks.push({
      x: x + random(-8, 8),
      y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: random(1.2, 2.5),
      age: 0,
      size: random(2, 4),
      color,
      opacity: 1,
    });
  }

  function addSmoke() {
    smokes.push({
      x: x + random(-20, 20),
      y: y - random(20, 40),
      vx: random(-15, 15),
      vy: random(-80, -40),
      life: random(2, 5),
      age: 0,
      size: random(40, 90),
      opacity: random(0.1, 0.25),
    });
  }

  return new Promise((resolve) => {
    function drawFrame(now) {
      const elapsed = now - startTime;
      const dt = 0.016;

      // Emit sparks and smoke
      for (let i = 0; i < 12; i++) addSpark();
      if (Math.random() < 0.25) addSmoke();

      // Update sparks
      for (let i = sparks.length - 1; i >= 0; i--) {
        const p = sparks[i];
        p.age += dt;
        if (p.age >= p.life) {
          sparks.splice(i, 1);
          continue;
        }
        p.vy += 700 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.opacity = 1 - p.age / p.life;
        if (p.y > y) {
          p.y = y;
          p.vy *= -0.3;
          p.vx *= 0.6;
          p.age += 0.2;
        }
      }

      // Update smoke
      for (let i = smokes.length - 1; i >= 0; i--) {
        const s = smokes[i];
        s.age += dt;
        if (s.age >= s.life) {
          smokes.splice(i, 1);
          continue;
        }
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        s.opacity = (1 - s.age / s.life) * 0.25;
      }

      // Draw
      ctx.save();
      ctx.globalCompositeOperation = "lighter";

      // Ground glow
      const grad = ctx.createRadialGradient(x, y, 0, x, y, glowRadius);
      grad.addColorStop(0, "rgba(255,200,90,0.4)");
      grad.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, glowRadius, 0, Math.PI * 2);
      ctx.fill();

      // Smoke
      smokes.forEach((s) => {
        const sg = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.size);
        sg.addColorStop(0, `rgba(160,160,160,${s.opacity})`);
        sg.addColorStop(1, `rgba(20,20,20,0)`);
        ctx.fillStyle = sg;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // Sparks
      sparks.forEach((p) => {
        const size = p.size * (Math.random() * 0.5 + 0.75);
        ctx.globalAlpha = p.opacity * 0.9;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
        ctx.fill();

        // Trail
        ctx.globalAlpha = p.opacity * 0.4;
        const trail = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.vy * 0.05);
        trail.addColorStop(0, p.color);
        trail.addColorStop(1, "transparent");
        ctx.strokeStyle = trail;
        ctx.lineWidth = size;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x, p.y + p.vy * 0.08);
        ctx.stroke();
      });

      ctx.restore();

      if (elapsed < duration) {
        requestAnimationFrame(drawFrame);
      } else {
        resolve();
      }
    }

    requestAnimationFrame(drawFrame);
  });
}


    async function launchFlowerpotsAndLightLamps() {
      const leftX = 70;
      const leftY = canvas.height - 60;
      const rightX = canvas.width - 70;
      const rightY = canvas.height - 60;

      await Promise.all([
        startFlowerpotCracker(leftX, leftY),
        startFlowerpotCracker(rightX, rightY)
      ]);

      // After both done, light lamps
      areLampsLit = true;
      lamps.forEach(l => l.classList.add('lit'));
      firstBlastDone = false;
      messageBox.classList.remove("show");
      startAutoFireworks();
      launchSound.play().catch(() => {});
    }

    window.onload = () => {
      animate();
      // If user never clicks, start flowerpots after 3s
      setTimeout(() => {
        if (!lampsClicked) {
          launchFlowerpotsAndLightLamps();
        }
      }, 3000);
    };

  </script>
</body>
</html>
